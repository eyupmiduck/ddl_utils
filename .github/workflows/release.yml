name: Release

# Publishes a tagged commit to GitHub Packages and opens the matching GitHub
# Release. The tag is the single source of truth for the version: the tag name
# (without the leading `v`) is passed as -Drevision, overriding the ${revision}
# property in the POM. Bump <revision> in the POM only for local/snapshot
# builds; a release never edits it.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# `packages: write` publishes to GitHub Packages, `contents: write` creates the
# GitHub Release, and `packages: read` (implied by write) fetches the
# liquibase-validation build dependency.
permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          # Writes a ~/.m2/settings.xml server entry (id `github`) used both to
          # read liquibase-validation and to publish the ddl_utils packages.
          # GITHUB_TOKEN must be exported to the Maven step below.
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Set up Python and SQLFluff
        run: pip install sqlfluff

      - name: Build custom PostgreSQL image
        run: scripts/build-postgres-image.sh postgres:17-alpine

      - name: Derive the version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # deploy runs the full lifecycle, so the release is gated on the same
      # tests and changelog linters as a pull request.
      - name: Build, test and deploy
        run: >-
          ./mvnw --batch-mode clean deploy
          -Drevision="$REVISION"
          -Dpostgres.image=ddl-utils-postgres:17-alpine
        env:
          REVISION: ${{ steps.version.outputs.value }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Create the GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
