name: Release

# Publishes a tagged commit to GitHub Packages and opens the matching GitHub
# Release. The reusable workflow derives -Drevision from the tag, so the tag is
# the single source of truth for the release version; the POM's <revision> is
# kept current afterwards by an automated follow-up PR (bump-snapshot), not by
# the release itself.
on:
  push:
    tags:
      # Only a <major>.<minor>.<patch> tag releases; v1foo, v1beta, v1-test or
      # a bare v1 would otherwise derive an invalid -Drevision from the tag.
      - "v[0-9]*.[0-9]*.[0-9]*"

concurrency:
  # Serialize all releases, not just runs of the same tag: two tags pushed close
  # together must not race the publish and bump-snapshot flow.
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release:
    # Pinned to the workflow_library commit; bump the SHA deliberately when
    # upgrading the library. Keep it in step with the scripts/ submodule.
    permissions:
      contents: write
      packages: write
      pull-requests: write
    uses: eyupmiduck/workflow_library/.github/workflows/maven-release.yml@16adb4400f7e82020f791cc367775819220ebb60 # main, verified 2026-11-06
    with:
      java-version: "25"
      postgres-version: postgres:17-alpine
      project: ddl_utils
      # After the release, open a PR bumping the POM's <revision> to the next
      # patch snapshot. The PR is opened with RELEASE_TOKEN (a PAT/App token),
      # because GITHUB_TOKEN-opened PRs do not trigger the required checks.
      bump-snapshot: true
    # RELEASE_TOKEN must be a repo-scoped fine-grained PAT/GitHub App token with
    # contents: write and pull-requests: write. Protect this job with a
    # required-review environment in repository settings.
    secrets:
      release-token: ${{ secrets.RELEASE_TOKEN }}
