name: CodeQL

# Static analysis for Java. Runs on every change to main and on a weekly
# schedule so newly added CodeQL queries are applied to unchanged code.
# The analysis itself lives in workflow_library.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "27 3 * * 1"

# All analyses on a given ref are serialized: push and scheduled runs publish
# SARIF under the same ref/category, so they must not overlap. Superseded
# pull-request runs on the same ref are cancelled; push and scheduled runs are
# left to finish so main always gets a complete analysis.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  # Uploading the SARIF report needs this. It is read-only for pull_request
  # runs from forks, and the called workflow uploads as part of its analyze
  # step with no way to skip just the upload, so the analyze job is skipped for
  # fork PRs (see its `if:`) rather than failing with 403 after a full analysis.
  # The push to main still analyzes the merged code and uploads.
  security-events: write

jobs:
  analyze:
    # A fork PR's security-events token cannot upload SARIF. Skip the whole
    # analysis there instead of burning it and failing the upload; same-repo
    # PRs, pushes to main and the schedule analyze and upload as before.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.fork == false
    # Pinned to the workflow_library commit; bump the SHA deliberately when
    # upgrading the library.
    #
    # build-mode: none extracts the database from source without compiling.
    # A full build would need Docker (Testcontainers-driven jOOQ codegen) and
    # a GitHub Packages token; the generated jOOQ classes are not
    # security-relevant, so skipping the build is the pragmatic trade-off.
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: eyupmiduck/workflow_library/.github/workflows/codeql.yml@83d3de534b94b63f7876709f2e969621136caaf8 # main, verified 2026-11-06
    with:
      languages: java-kotlin
      build-mode: none
      category: /language:java-kotlin
