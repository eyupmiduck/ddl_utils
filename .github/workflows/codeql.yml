name: CodeQL

# Static analysis for Java. Runs on every change to main and on a weekly
# schedule so newly added CodeQL queries are applied to unchanged code.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "27 3 * * 1"

# Superseded pull-request runs on the same ref are useless once a newer run
# starts; push and scheduled runs are left to finish so main always gets a
# complete analysis.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # build-mode: none extracts the database from source without compiling.
      # A full build would need Docker (Testcontainers-driven jOOQ codegen) and
      # a GitHub Packages token; the generated jOOQ classes are not
      # security-relevant, so skipping the build is the pragmatic trade-off.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: java-kotlin
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          category: "/language:java-kotlin"
