name: Changelog linter

# Runs the Liquibase changelog linter with the SARIF reporter and uploads the
# result to GitHub code scanning, so changelog findings show inline on the pull
# request next to CodeQL. The failing gate itself is `./mvnw verify` in the
# Maven Build workflow; this job exists to surface the findings in the code
# scanning UI. The linter runner lives in workflow_library.
on:
  pull_request:
    branches:
      - main

concurrency:
  group: changelog-linter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  security-events: write

jobs:
  lint:
    # Pinned to the workflow_library commit; bump the SHA deliberately when
    # upgrading the library.
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: eyupmiduck/workflow_library/.github/workflows/liquibase-changelog-linter.yml@f722e6e3baf3eff163720b4910fb09a94c623fd4
    with:
      maven-module: ddl_utils
      changelog-root: ddl_utils/src/main/resources/db/changelog
      config-path: ddl_utils/.liquibase-linter.yml
      whitelist-path: ddl_utils/.liquibase-linter-whitelist.yml
