name: Changelog linter

# Runs the Liquibase changelog linter with the SARIF reporter and uploads the
# result to GitHub code scanning, so changelog findings show inline on the pull
# request next to CodeQL. The failing gate itself is `./mvnw verify` in the
# Maven Build workflow; this job exists to surface the findings in the code
# scanning UI. The linter runner lives in workflow_library.
on:
  pull_request:
    branches:
      - main
    paths:
      - 'ddl_utils/src/main/resources/db/changelog/**'
      - 'ddl_utils/.liquibase-linter.yml'
      - 'ddl_utils/.liquibase-linter-whitelist.yml'
      - 'pom.xml'
      - 'ddl_utils/pom.xml'
      - '.github/workflows/changelog-linter.yml'

concurrency:
  group: changelog-linter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  # Needed for the SARIF upload. It is read-only for pull_request runs from
  # forks, so the called workflow's upload is disabled there via the
  # `upload-sarif` input below; the lint still runs and `verify` stays the gate.
  # Same-repo PRs, pushes and schedules upload.
  security-events: write

jobs:
  lint:
    # Pinned to the workflow_library commit; bump the SHA deliberately when
    # upgrading the library. The caller-level permissions above are the source
    # of truth: a called workflow can only keep or reduce them.
    uses: eyupmiduck/workflow_library/.github/workflows/liquibase-changelog-linter.yml@83d3de534b94b63f7876709f2e969621136caaf8 # main, verified 2026-11-06
    with:
      maven-module: ddl_utils
      changelog-root: ddl_utils/src/main/resources/db/changelog
      config-path: ddl_utils/.liquibase-linter.yml
      whitelist-path: ddl_utils/.liquibase-linter-whitelist.yml
      # A fork PR gets a read-only security-events token, so an upload would
      # fail with 403. Keep the lint result in the job log and skip only the
      # upload; the failing gate is `./mvnw verify` anyway.
      upload-sarif: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
