name: Maven Build

on:
  pull_request:
    branches:
      - main

concurrency:
  group: maven-${{ github.ref }}
  cancel-in-progress: true

# `packages: read` lets the reusable Maven workflow's GITHUB_TOKEN fetch the
# liquibase-validation artifact from GitHub Packages.
permissions:
  contents: read
  packages: read

jobs:
  build:
    # Pinned to the workflow_library commit; bump the SHA deliberately when
    # upgrading the library. Keep it in step with the scripts/ submodule.
    uses: eyupmiduck/workflow_library/.github/workflows/maven.yml@593fcd4bd1fe5a5cb9921360d7365747fc249b62 # main, verified 2026-11-06
    with:
      java-version: "25"
      postgres-versions: '["postgres:16-alpine","postgres:17-alpine","postgres:18-alpine","postgres:19-alpine"]'
      project: ddl_utils
      maven-command: ./mvnw --batch-mode clean verify

  mvnw:
    # Covers the wrapper's install paths a normal build never reaches: the
    # concurrent-install lock/reuse and broken-cache reinstall. No PostgreSQL or
    # submodule checkout is needed.
    name: Maven wrapper install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Maven wrapper install tests
        run: bash .github/scripts/mvnw-install-test.sh
