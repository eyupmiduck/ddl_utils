name: OpenCodeReview PR Review

# Use pull_request_target instead of pull_request so Secrets are available
# for PRs from forks. This is safe because OCR only reads the diff and does
# not execute any code from the PR.
on:
  pull_request_target:
    types:
      - opened
  issue_comment:
    types:
      - created

# Matching events share a per-PR group so a new review cancels any stale one.
# Non-matching comments land in a unique noop group so they are skipped
# instantly without cancelling a running review.
concurrency:
  group: >-
    ${{
      (
        github.event_name == 'pull_request_target'
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.type != 'Bot'
          && (
            github.event.comment.author_association == 'MEMBER'
            || github.event.comment.author_association == 'OWNER'
            || github.event.comment.author_association == 'COLLABORATOR'
          )
          && startsWith(github.event.comment.body, '/open-code-review')
        )
      )
      && format('ocr-{0}', github.event.pull_request.number || github.event.issue.number)
      || format('noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    uses: eyupmiduck/workflow_library/.github/workflows/ocr-review.yml@main
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit
