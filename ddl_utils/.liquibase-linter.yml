# Configuration for the Liquibase changelog linter (bead ddl-w8y.19).
#
# The linter runs during `verify` via the `liquibase-linter` execution in
# pom.xml; this file is passed with --config. See the linter epic ddl-w8y for
# the rule model, and the liquibase-validation README for every key.

# PostgreSQL major version used by version-gated rules (for example
# ALTER TYPE ... ADD VALUE). Keep in step with the postgres.version property in
# the parent POM.
pgVersion: '17'

# Opt-in rules this module runs. They are off unless listed here.
# changeset-rollback-parity is deliberately not enabled: its statement-count
# heuristic warns on legitimate many-to-few inversions (for example the
# grant-privileges changeset), so it would be noise here.
# routine-dynamic-sql is informational (ddl_utils_lib.alter_table builds SQL
# dynamically); it does not fail the gate, which is --fail-on error.
include:
  - changeset-prefer-single-statement
  - require-concurrent-index-creation
  - require-concurrent-index-deletion
  - changeset-rollback-required
  - routine-dynamic-sql

# A finding is accepted by listing its rule under `exclude`, or by downgrading
# it under `rules`. The verify gate fails on `error` findings (see the
# --fail-on argument in pom.xml), so an included warning rule is reported but
# does not by itself fail the build.
