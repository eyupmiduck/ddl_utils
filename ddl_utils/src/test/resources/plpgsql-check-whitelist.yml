# Accepted plpgsql_check findings.
#
# PlpgsqlCheckTest runs plpgsql_check_function_tb(..., all_warnings => true)
# over every routine in ddl_utils / ddl_utils_lib and matches each finding
# against one of these entries (field by field; omit a field to match any
# value). A finding with no match fails the test, and an entry that matches no
# finding is reported as stale and also fails.
- schema: ddl_utils_lib
  function: alter_table
  level: security
  statement: EXECUTE
  message: text type variable is not sanitized
  reason: >-
    The internal runner executes a caller-provided ALTER TABLE fragment and is
    SECURITY INVOKER, so a caller already holds the privileges the fragment
    would use. The dynamic SQL is deliberate; see alter_table.sql.

- schema: ddl_utils_lib
  function: quote_identifiers
  level: warning
  message: routine is marked as IMMUTABLE, but expression is STABLE
  reason: >-
    quote_identifiers performs no database access; it only validates and
    formats its argument with unnest/format/string_agg, all immutable.
    plpgsql_check cannot prove the aggregate subquery immutable.

- schema: ddl_utils_lib
  function: assert_one_based
  level: performance
  message: routine is marked as STABLE, should be IMMUTABLE
  reason: >-
    The routine only validates and raises. It is intentionally STABLE so the
    planner does not constant-fold a literal call and raise at plan time for a
    branch that would never execute; plpgsql_check only sees that it has no
    database access.
